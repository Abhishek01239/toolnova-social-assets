<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182B"/>
      <stop offset="1" stop-color="#1A2744"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6BFF"/>
      <stop offset="1" stop-color="#3EE0B2"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="180" cy="180" r="140" fill="#7C6BFF" opacity="0.16"/>
  <circle cx="940" cy="860" r="200" fill="#3EE0B2" opacity="0.1"/>
  <text x="90" y="150" fill="#A9B7D0" font-family="Segoe UI, Arial, sans-serif" font-size="28" letter-spacing="3">TOOLNOVA</text>
  <text x="90" y="240" fill="#F7F9FC" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700">JSON Formatter</text>
  <text x="90" y="306" fill="#C9B8FF" font-family="Segoe UI, Arial, sans-serif" font-size="34">2 spaces, 4 spaces, or tabs.</text>
  <rect x="90" y="360" width="250" height="64" rx="32" fill="#7C6BFF"/>
  <text x="128" y="402" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">2 spaces</text>
  <rect x="360" y="360" width="250" height="64" rx="32" fill="#243352" stroke="#7C6BFF"/>
  <text x="398" y="402" fill="#E6ECF7" font-family="Segoe UI, Arial, sans-serif" font-size="26">4 spaces</text>
  <rect x="630" y="360" width="200" height="64" rx="32" fill="#243352" stroke="#3EE0B2"/>
  <text x="688" y="402" fill="#E6ECF7" font-family="Segoe UI, Arial, sans-serif" font-size="26">Tabs</text>
  <rect x="90" y="470" width="900" height="300" rx="24" fill="#121B2E" stroke="#31466C"/>
  <text x="130" y="540" fill="#8EB4FF" font-family="ui-monospace, Consolas, monospace" font-size="30">{</text>
  <text x="160" y="590" fill="#F0C36A" font-family="ui-monospace, Consolas, monospace" font-size="30">"env"</text>
  <text x="270" y="590" fill="#E8EEF8" font-family="ui-monospace, Consolas, monospace" font-size="30">: "local",</text>
  <text x="160" y="640" fill="#F0C36A" font-family="ui-monospace, Consolas, monospace" font-size="30">"ready"</text>
  <text x="300" y="640" fill="#3EE0B2" font-family="ui-monospace, Consolas, monospace" font-size="30">: true</text>
  <text x="130" y="700" fill="#8EB4FF" font-family="ui-monospace, Consolas, monospace" font-size="30">}</text>
  <text x="620" y="580" fill="#9FB0CC" font-family="Segoe UI, Arial, sans-serif" font-size="26">Values stay the same.</text>
  <text x="620" y="626" fill="#9FB0CC" font-family="Segoe UI, Arial, sans-serif" font-size="26">Only whitespace changes.</text>
  <text x="620" y="690" fill="#3EE0B2" font-family="Segoe UI, Arial, sans-serif" font-size="26">Parsed in the browser.</text>
  <text x="90" y="840" fill="#F7F9FC" font-family="Segoe UI, Arial, sans-serif" font-size="32">Copy the result or download .json.</text>
  <text x="90" y="896" fill="#A9B7D0" font-family="Segoe UI, Arial, sans-serif" font-size="28">No signup. No watermark. No upload.</text>
  <rect x="90" y="940" width="300" height="54" rx="27" fill="url(#pill)"/>
  <text x="124" y="975" fill="#07131A" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Private by default</text>
</svg>
