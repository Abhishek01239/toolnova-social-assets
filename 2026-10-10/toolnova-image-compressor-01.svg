<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Browser window mockup -->
  <rect x="140" y="180" width="800" height="520" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <rect x="140" y="180" width="800" height="50" rx="20" fill="#f1f5f9"/>
  <circle cx="170" cy="205" r="8" fill="#ef4444"/>
  <circle cx="195" cy="205" r="8" fill="#f59e0b"/>
  <circle cx="220" cy="205" r="8" fill="#10b981"/>
  <!-- Image area -->
  <rect x="200" y="260" width="320" height="240" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/>
  <text x="360" y="390" font-family="Arial, sans-serif" font-size="24" fill="#0369a1" text-anchor="middle" font-weight="bold">Original</text>
  <text x="360" y="420" font-family="Arial, sans-serif" font-size="20" fill="#0369a1" text-anchor="middle">2.4 MB</text>
  <!-- Arrow -->
  <path d="M540 380 L600 380 L590 370 M600 380 L590 390" stroke="#22d3ee" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Compressed image -->
  <rect x="620" y="260" width="260" height="195" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="750" y="360" font-family="Arial, sans-serif" font-size="22" fill="#15803d" text-anchor="middle" font-weight="bold">Compressed</text>
  <text x="750" y="390" font-family="Arial, sans-serif" font-size="18" fill="#15803d" text-anchor="middle">480 KB</text>
  <!-- Slider -->
  <rect x="300" y="540" width="480" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="300" y="540" width="280" height="12" rx="6" fill="url(#accent)"/>
  <circle cx="580" cy="546" r="16" fill="#ffffff" stroke="#22d3ee" stroke-width="4"/>
  <text x="540" y="600" font-family="Arial, sans-serif" font-size="22" fill="#334155" text-anchor="middle" font-weight="600">Quality Slider</text>
  <!-- Branding -->
  <text x="540" y="780" font-family="Arial, sans-serif" font-size="64" fill="#ffffff" text-anchor="middle" font-weight="bold">ToolNova</text>
  <text x="540" y="850" font-family="Arial, sans-serif" font-size="42" fill="#22d3ee" text-anchor="middle" font-weight="bold">Image Compressor</text>
  <text x="540" y="910" font-family="Arial, sans-serif" font-size="28" fill="#cbd5e1" text-anchor="middle">Free • Private • Browser-based</text>
  <!-- Privacy badge -->
  <rect x="390" y="950" width="300" height="50" rx="25" fill="#22d3ee"/>
  <text x="540" y="982" font-family="Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">No Uploads • 100% Local</text>
</svg>