<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="180" x2="1080" y2="180"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="540" x2="1080" y2="540"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="900" x2="1080" y2="900"/>
    <line x1="180" y1="0" x2="180" y2="1080"/>
    <line x1="360" y1="0" x2="360" y2="1080"/>
    <line x1="540" y1="0" x2="540" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="900" y1="0" x2="900" y2="1080"/>
  </g>
  <!-- Browser window -->
  <rect x="140" y="180" width="800" height="560" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="140" y="180" width="800" height="60" rx="24" fill="#0f172a"/>
  <rect x="140" y="210" width="800" height="30" fill="#0f172a"/>
  <circle cx="180" cy="210" r="8" fill="#ef4444"/>
  <circle cx="210" cy="210" r="8" fill="#f59e0b"/>
  <circle cx="240" cy="210" r="8" fill="#22c55e"/>
  <text x="540" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Password Generator</text>
  <!-- Content area -->
  <rect x="180" y="260" width="720" height="440" rx="16" fill="#0f172a"/>
  <!-- Header -->
  <text x="220" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#fff">🔑 Strong Password Generator</text>
  <text x="220" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">Secure • Random • Private • Free</text>
  <!-- Password display -->
  <rect x="220" y="400" width="640" height="80" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="250" y="452" font-family="ui-monospace, monospace" font-size="28" fill="#22d3ee" letter-spacing="1">K7#mP9$vL2@qR8nX</text>
  <!-- Strength bar -->
  <text x="220" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">Strength: Very Strong • 105 bits</text>
  <rect x="220" y="545" width="640" height="16" rx="8" fill="#1e293b"/>
  <rect x="220" y="545" width="580" height="16" rx="8" fill="url(#accent)"/>
  <!-- Options row -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e2e8f0">
    <rect x="220" y="590" width="20" height="20" rx="4" fill="#22d3ee"/>
    <text x="252" y="606">Length: 16</text>
    <rect x="380" y="590" width="20" height="20" rx="4" fill="#22d3ee"/>
    <text x="412" y="606">Symbols</text>
    <rect x="520" y="590" width="20" height="20" rx="4" fill="#22d3ee"/>
    <text x="552" y="606">Numbers</text>
    <rect x="660" y="590" width="20" height="20" rx="4" fill="#22d3ee"/>
    <text x="692" y="606">Exclude look-alikes</text>
  </g>
  <!-- Buttons -->
  <rect x="220" y="640" width="180" height="48" rx="12" fill="#22d3ee"/>
  <text x="310" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">↻ New Password</text>
  <rect x="420" y="640" width="140" height="48" rx="12" fill="#334155"/>
  <text x="490" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">Copy</text>
  <!-- Bottom badge -->
  <rect x="340" y="780" width="400" height="60" rx="30" fill="#22d3ee"/>
  <text x="540" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">100% Private • Runs in Browser</text>
  <!-- Logo / brand -->
  <text x="540" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#fff" text-anchor="middle">ToolNova</text>
  <text x="540" y="1020" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Free Privacy-Focused Online Tools</text>
</svg>