<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Shield for privacy -->
  <path d="M540 180 L700 240 L700 420 Q700 520 540 580 Q380 520 380 420 L380 240 Z" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.8"/>
  <!-- QR code stylized -->
  <g transform="translate(390, 280)">
    <rect x="0" y="0" width="300" height="300" fill="#ffffff" rx="20"/>
    <rect x="20" y="20" width="80" height="80" fill="#0f172a"/>
    <rect x="200" y="20" width="80" height="80" fill="#0f172a"/>
    <rect x="20" y="200" width="80" height="80" fill="#0f172a"/>
    <rect x="40" y="40" width="40" height="40" fill="#3b82f6"/>
    <rect x="220" y="40" width="40" height="40" fill="#3b82f6"/>
    <rect x="40" y="220" width="40" height="40" fill="#3b82f6"/>
    <!-- data modules -->
    <rect x="120" y="40" width="20" height="20" fill="#0f172a"/>
    <rect x="160" y="40" width="20" height="20" fill="#0f172a"/>
    <rect x="120" y="80" width="20" height="20" fill="#0f172a"/>
    <rect x="200" y="120" width="20" height="20" fill="#0f172a"/>
    <rect x="120" y="160" width="40" height="20" fill="#0f172a"/>
    <rect x="180" y="180" width="20" height="40" fill="#0f172a"/>
    <rect x="40" y="120" width="20" height="20" fill="#0f172a"/>
    <rect x="80" y="160" width="20" height="20" fill="#0f172a"/>
  </g>
  <!-- Lock icon -->
  <g transform="translate(480, 160)">
    <rect x="20" y="40" width="40" height="30" rx="4" fill="#06b6d4"/>
    <path d="M30 40 V30 A10 10 0 0 1 50 30 V40" fill="none" stroke="#06b6d4" stroke-width="6"/>
  </g>
  <text x="540" y="720" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">QR Code Generator</text>
  <text x="540" y="790" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">Private • Instant • No Upload</text>
  <text x="540" y="860" font-family="Arial, sans-serif" font-size="28" fill="#3b82f6" text-anchor="middle">ToolNova</text>
  <!-- Browser icon hint -->
  <rect x="420" y="900" width="240" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="450" cy="930" r="8" fill="#ef4444"/>
  <circle cx="480" cy="930" r="8" fill="#f59e0b"/>
  <circle cx="510" cy="930" r="8" fill="#22c55e"/>
