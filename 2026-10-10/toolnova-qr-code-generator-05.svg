<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Privacy shield -->
  <path d="M540 180 L680 240 V420 C680 560 540 680 540 680 C540 680 400 560 400 420 V240 Z" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <path d="M540 220 L640 268 V400 C640 500 540 600 540 600 C540 600 440 500 440 400 V268 Z" fill="url(#accent)" opacity="0.2"/>
  <!-- Lock icon -->
  <rect x="500" y="340" width="80" height="60" rx="8" fill="#06b6d4"/>
  <path d="M520 340 V310 C520 290 560 290 560 310 V340" fill="none" stroke="#06b6d4" stroke-width="6"/>
  <!-- QR Code stylized -->
  <g transform="translate(390, 450)">
    <rect width="300" height="300" fill="#0f172a" stroke="#06b6d4" stroke-width="4" rx="8"/>
    <!-- Finder patterns -->
    <rect x="20" y="20" width="60" height="60" fill="#06b6d4"/>
    <rect x="30" y="30" width="40" height="40" fill="#0f172a"/>
    <rect x="35" y="35" width="30" height="30" fill="#06b6d4"/>
    <rect x="220" y="20" width="60" height="60" fill="#06b6d4"/>
    <rect x="230" y="30" width="40" height="40" fill="#0f172a"/>
    <rect x="235" y="35" width="30" height="30" fill="#06b6d4"/>
    <rect x="20" y="220" width="60" height="60" fill="#06b6d4"/>
    <rect x="30" y="230" width="40" height="40" fill="#0f172a"/>
    <rect x="35" y="235" width="30" height="30" fill="#06b6d4"/>
    <!-- Data modules -->
    <rect x="100" y="40" width="20" height="20" fill="#06b6d4"/>
    <rect x="140" y="40" width="20" height="20" fill="#06b6d4"/>
    <rect x="100" y="80" width="20" height="20" fill="#06b6d4"/>
    <rect x="160" y="100" width="20" height="20" fill="#06b6d4"/>
    <rect x="200" y="80" width="20" height="20" fill="#06b6d4"/>
    <rect x="120" y="140" width="20" height="20" fill="#06b6d4"/>
    <rect x="180" y="160" width="20" height="20" fill="#06b6d4"/>
    <rect x="100" y="200" width="20" height="20" fill="#06b6d4"/>
    <rect x="220" y="180" width="20" height="20" fill="#06b6d4"/>
  </g>
  <!-- Text -->
  <text x="540" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#f8fafc" text-anchor="middle">QR Code Generator</text>
  <text x="540" y="880" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Private • Browser-Based • Free</text>
  <text x="540" y="940" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#06b6d4" text-anchor="middle">ToolNova</text>
</svg>
