<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg2)"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="80" fill="#06b6d4" opacity="0.1"/>
  <circle cx="880" cy="300" r="60" fill="#3b82f6" opacity="0.1"/>
  <circle cx="150" cy="800" r="100" fill="#06b6d4" opacity="0.08"/>
  <!-- Main QR frame -->
  <rect x="340" y="280" width="400" height="400" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="6"/>
  <!-- Stylized QR -->
  <g transform="translate(380, 320)">
    <rect width="320" height="320" fill="#0f172a" rx="4"/>
    <!-- Corner markers -->
    <rect x="16" y="16" width="72" height="72" fill="#22d3ee"/>
    <rect x="28" y="28" width="48" height="48" fill="#0f172a"/>
    <rect x="36" y="36" width="32" height="32" fill="#22d3ee"/>
    <rect x="232" y="16" width="72" height="72" fill="#22d3ee"/>
    <rect x="244" y="28" width="48" height="48" fill="#0f172a"/>
    <rect x="252" y="36" width="32" height="32" fill="#22d3ee"/>
    <rect x="16" y="232" width="72" height="72" fill="#22d3ee"/>
    <rect x="28" y="244" width="48" height="48" fill="#0f172a"/>
    <rect x="36" y="252" width="32" height="32" fill="#22d3ee"/>
    <!-- Random data -->
    <rect x="110" y="30" width="24" height="24" fill="#22d3ee"/>
    <rect x="150" y="50" width="24" height="24" fill="#22d3ee"/>
    <rect x="190" y="30" width="24" height="24" fill="#22d3ee"/>
    <rect x="110" y="90" width="24" height="24" fill="#22d3ee"/>
    <rect x="170" y="110" width="24" height="24" fill="#22d3ee"/>
    <rect x="230" y="90" width="24" height="24" fill="#22d3ee"/>
    <rect x="130" y="150" width="24" height="24" fill="#22d3ee"/>
    <rect x="190" y="170" width="24" height="24" fill="#22d3ee"/>
    <rect x="110" y="210" width="24" height="24" fill="#22d3ee"/>
    <rect x="250" y="190" width="24" height="24" fill="#22d3ee"/>
  </g>
  <!-- Icons around -->
  <text x="540" y="200" font-family="system-ui, sans-serif" font-size="36" fill="#06b6d4" text-anchor="middle">🔒 Wi-Fi • UPI • WhatsApp</text>
  <!-- Bottom text -->
  <text x="540" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Free QR Codes</text>
  <text x="540" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Created locally in your browser</text>
  <text x="540" y="900" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#22d3ee" text-anchor="middle">ToolNova</text>
  <text x="540" y="960" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#64748b" text-anchor="middle">No signup • No watermarks • 100% private</text>
</svg>
