    <path d="M80 40c-22 0-40 18-40 40v20h-10c-8 0-14 6-14 14v60c0 8 6 14 14 14h100c8 0 14-6 14-14v-60c0-8-6-14-14-14h-10V80c0-22-18-40-40-40zm0 20c11 0 20 9 20 20v20H60V80c0-11 9-20 20-20z" fill="#14b8a6"/>
