<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="140" y="160" width="800" height="620" rx="20" fill="#0f3460" filter="url(#shadow)"/>
  <rect x="140" y="160" width="800" height="50" rx="20" fill="#e94560"/>
  <circle cx="180" cy="185" r="8" fill="#ff6b6b"/>
  <circle cx="210" cy="185" r="8" fill="#ffd93d"/>
  <circle cx="240" cy="185" r="8" fill="#6bcf7f"/>
  <text x="540" y="195" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">ToolNova QR Code Generator</text>
  <!-- QR Code mock -->
  <g transform="translate(340,280)">
    <rect width="400" height="400" fill="white" rx="10"/>
    <!-- Simplified QR pattern -->
    <rect x="20" y="20" width="80" height="80" fill="#1a1a2e"/>
    <rect x="300" y="20" width="80" height="80" fill="#1a1a2e"/>
    <rect x="20" y="300" width="80" height="80" fill="#1a1a2e"/>
    <rect x="40" y="40" width="40" height="40" fill="white"/>
    <rect x="320" y="40" width="40" height="40" fill="white"/>
    <rect x="40" y="320" width="40" height="40" fill="white"/>
    <!-- Data modules -->
    <rect x="120" y="40" width="20" height="20" fill="#1a1a2e"/>
    <rect x="160" y="60" width="20" height="20" fill="#1a1a2e"/>
    <rect x="200" y="40" width="20" height="20" fill="#1a1a2e"/>
    <rect x="140" y="100" width="20" height="20" fill="#1a1a2e"/>
    <rect x="180" y="120" width="20" height="20" fill="#1a1a2e"/>
    <rect x="220" y="100" width="20" height="20" fill="#1a1a2e"/>
    <rect x="120" y="180" width="20" height="20" fill="#1a1a2e"/>
    <rect x="160" y="200" width="20" height="20" fill="#1a1a2e"/>
    <rect x="200" y="180" width="20" height="20" fill="#1a1a2e"/>
    <rect x="260" y="140" width="20" height="20" fill="#1a1a2e"/>
    <rect x="300" y="160" width="20" height="20" fill="#1a1a2e"/>
    <rect x="140" y="240" width="20" height="20" fill="#1a1a2e"/>
    <rect x="180" y="260" width="20" height="20" fill="#1a1a2e"/>
    <rect x="220" y="240" width="20" height="20" fill="#1a1a2e"/>
  </g>
  <!-- Privacy badge -->
  <rect x="340" y="720" width="400" height="80" rx="40" fill="#6bcf7f"/>
  <text x="540" y="770" font-family="Arial, sans-serif" font-size="28" fill="#1a1a2e" text-anchor="middle" font-weight="bold">100% Private • In Browser</text>
  <!-- Bottom text -->
  <text x="540" y="880" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">Free QR Codes</text>
  <text x="540" y="930" font-family="Arial, sans-serif" font-size="24" fill="#a0a0a0" text-anchor="middle">Wi-Fi • UPI • WhatsApp • Links</text>
  <text x="540" y="980" font-family="Arial, sans-serif" font-size="22" fill="#e94560" text-anchor="middle">No Signup • No Watermarks</text>
</svg>