<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="140" y="180" width="800" height="620" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <rect x="140" y="180" width="800" height="50" rx="20" fill="#f1f5f9"/>
  <circle cx="170" cy="205" r="8" fill="#ef4444"/>
  <circle cx="195" cy="205" r="8" fill="#f59e0b"/>
  <circle cx="220" cy="205" r="8" fill="#10b981"/>
  <!-- QR Code mockup -->
  <rect x="280" y="280" width="520" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Simple QR pattern -->
  <rect x="320" y="320" width="80" height="80" fill="#0f172a"/>
  <rect x="680" y="320" width="80" height="80" fill="#0f172a"/>
  <rect x="320" y="580" width="80" height="80" fill="#0f172a"/>
  <rect x="420" y="420" width="40" height="40" fill="#0f172a"/>
  <rect x="480" y="380" width="40" height="40" fill="#0f172a"/>
  <rect x="540" y="460" width="40" height="40" fill="#0f172a"/>
  <rect x="600" y="400" width="40" height="40" fill="#0f172a"/>
  <rect x="440" y="520" width="40" height="40" fill="#0f172a"/>
  <rect x="560" y="540" width="40" height="40" fill="#0f172a"/>
  <rect x="620" y="500" width="40" height="40" fill="#0f172a"/>
  <!-- Text -->
  <text x="540" y="120" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">QR Code Generator</text>
  <text x="540" y="860" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#38bdf8" text-anchor="middle">ToolNova</text>
  <text x="540" y="920" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#cbd5e1" text-anchor="middle">Private • Free • No Signup</text>
  <!-- Privacy badge -->
  <rect x="380" y="960" width="320" height="60" rx="30" fill="#10b981"/>
  <text x="540" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Files Stay in Browser</text>
</svg>