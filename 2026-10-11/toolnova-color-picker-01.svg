<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000"/>
      <stop offset="16%" style="stop-color:#ff7f00"/>
      <stop offset="33%" style="stop-color:#ffff00"/>
      <stop offset="50%" style="stop-color:#00ff00"/>
      <stop offset="66%" style="stop-color:#0000ff"/>
      <stop offset="83%" style="stop-color:#4b0082"/>
      <stop offset="100%" style="stop-color:#9400d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="90" y="140" width="900" height="720" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="90" y="140" width="900" height="60" rx="24" fill="#f1f5f9"/>
  <circle cx="140" cy="170" r="12" fill="#ef4444"/>
  <circle cx="176" cy="170" r="12" fill="#f59e0b"/>
  <circle cx="212" cy="170" r="12" fill="#22c55e"/>
  <rect x="280" y="155" width="480" height="30" rx="15" fill="#e2e8f0"/>
  <text x="520" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">toolnova.app/color-picker</text>
  <!-- Color wheel / picker area -->
  <rect x="160" y="240" width="520" height="480" rx="16" fill="url(#rainbow)" opacity="0.9"/>
  <circle cx="420" cy="480" r="180" fill="none" stroke="#ffffff" stroke-width="8"/>
  <circle cx="420" cy="480" r="140" fill="#ffffff" opacity="0.3"/>
  <circle cx="480" cy="420" r="28" fill="#3b82f6" stroke="#ffffff" stroke-width="6"/>
  <!-- Selected color panel -->
  <rect x="720" y="240" width="220" height="200" rx="16" fill="#3b82f6"/>
  <text x="830" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">#3B82F6</text>
  <text x="830" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#dbeafe" text-anchor="middle">RGB 59, 130, 246</text>
  <text x="830" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#dbeafe" text-anchor="middle">HSL 217, 91%, 60%</text>
  <!-- Tool name -->
  <text x="540" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="42" fill="#0f172a" text-anchor="middle" font-weight="800">Color Picker</text>
  <text x="540" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#475569" text-anchor="middle">Pick any color • Copy HEX, RGB, HSL</text>
  <!-- Privacy badge -->
  <rect x="340" y="880" width="400" height="56" rx="28" fill="#10b981"/>
  <text x="540" y="915" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="600">🔒 100% Private • Runs in Browser</text>
  <!-- Logo -->
  <text x="540" y="1000" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#6366f1" text-anchor="middle" font-weight="700">ToolNova</text>
</svg>