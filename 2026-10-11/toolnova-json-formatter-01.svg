<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#64748b" stroke-width="1">
    <path d="M0 120 H1080 M0 240 H1080 M0 360 H1080 M0 480 H1080 M0 600 H1080 M0 720 H1080 M0 840 H1080 M0 960 H1080"/>
    <path d="M120 0 V1080 M240 0 V1080 M360 0 V1080 M480 0 V1080 M600 0 V1080 M720 0 V1080 M840 0 V1080 M960 0 V1080"/>
  </g>
  <!-- Main card -->
  <rect x="120" y="160" width="840" height="620" rx="28" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <!-- Browser chrome -->
  <rect x="140" y="180" width="800" height="48" rx="12" fill="#0f172a"/>
  <circle cx="170" cy="204" r="8" fill="#ef4444"/>
  <circle cx="196" cy="204" r="8" fill="#f59e0b"/>
  <circle cx="222" cy="204" r="8" fill="#22c55e"/>
  <rect x="260" y="192" width="540" height="24" rx="6" fill="#334155"/>
  <text x="280" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#94a3b8">toolnova.app/tools/json-formatter</text>
  <!-- JSON input (messy) -->
  <text x="160" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#f97316">Input (raw)</text>
  <rect x="160" y="295" width="360" height="200" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="175" y="325" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#e2e8f0">{"name":"ToolNova","tools":190,"private":true,"features":["free","local"]}</text>
  <!-- Arrow -->
  <path d="M540 390 L620 390 L600 370 M620 390 L600 410" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- JSON output (formatted) -->
  <text x="660" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#22c55e">Formatted</text>
  <rect x="660" y="295" width="280" height="200" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="675" y="325" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#a5f3fc">{
  "name": "ToolNova",
  "tools": 190,
  "private": true,
  "features": [
    "free",
    "local"
  ]
}</text>
  <!-- Buttons -->
  <rect x="160" y="520" width="140" height="42" rx="10" fill="#0ea5e9"/>
  <text x="230" y="547" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Format</text>
  <rect x="320" y="520" width="140" height="42" rx="10" fill="#475569"/>
  <text x="390" y="547" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Minify</text>
  <rect x="480" y="520" width="160" height="42" rx="10" fill="#475569"/>
  <text x="560" y="547" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Validate</text>
  <!-- Privacy badge -->
  <rect x="160" y="590" width="280" height="36" rx="18" fill="#064e3b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="300" y="614" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7" text-anchor="middle">✓ 100% Private · Runs in browser</text>
  <!-- Title -->
  <text x="540" y="140" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="700" fill="#f8fafc" text-anchor="middle">JSON Formatter</text>
  <text x="540" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#38bdf8" text-anchor="middle">Beautify · Validate · Minify</text>
  <text x="540" y="880" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Free · No signup · Nothing leaves your device</text>
  <!-- Logo word -->
  <text x="540" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ToolNova</text>
</svg>