<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="140" y="180" width="800" height="620" rx="24" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>
  <!-- Title bar -->
  <rect x="140" y="180" width="800" height="60" rx="24" fill="#0f172a"/>
  <circle cx="180" cy="210" r="10" fill="#ef4444"/>
  <circle cx="210" cy="210" r="10" fill="#f59e0b"/>
  <circle cx="240" cy="210" r="10" fill="#10b981"/>
  <text x="400" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">toolnova-seven.vercel.app/tools/password-generator</text>
  <!-- Content -->
  <text x="540" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f8fafc" text-anchor="middle">🔑 Password Generator</text>
  <text x="540" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#cbd5e1" text-anchor="middle">Secure · Random · 100% Local</text>
  <!-- Password display -->
  <rect x="220" y="430" width="640" height="100" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
  <text x="540" y="490" font-family="ui-monospace, monospace" font-size="36" fill="#60a5fa" text-anchor="middle">K7m#pQ2$xL9vN4!a</text>
  <!-- Entropy badge -->
  <rect x="360" y="560" width="360" height="50" rx="25" fill="#10b981"/>
  <text x="540" y="592" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">~105 bits · Very Strong</text>
  <!-- Privacy badge -->
  <rect x="280" y="650" width="520" height="70" rx="16" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="693" font-family="system-ui, sans-serif" font-size="24" fill="#93c5fd" text-anchor="middle">🔒 Runs in your browser · Never leaves your device</text>
  <!-- Bottom branding -->
  <text x="540" y="920" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" text-anchor="middle">ToolNova</text>
  <text x="540" y="960" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Free privacy-first online tools</text>
</svg>