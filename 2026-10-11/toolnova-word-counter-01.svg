<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <path d="M0 180 H1080 M0 360 H1080 M0 540 H1080 M0 720 H1080 M0 900 H1080"/>
    <path d="M180 0 V1080 M360 0 V1080 M540 0 V1080 M720 0 V1080 M900 0 V1080"/>
  </g>
  <!-- Browser window -->
  <g filter="url(#shadow)">
    <rect x="90" y="140" width="900" height="620" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="90" y="140" width="900" height="56" rx="24" fill="#0f172a"/>
    <circle cx="120" cy="168" r="8" fill="#ef4444"/>
    <circle cx="148" cy="168" r="8" fill="#f59e0b"/>
    <circle cx="176" cy="168" r="8" fill="#22c55e"/>
    <text x="540" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle">Word Counter</text>
    <!-- Content area -->
    <rect x="110" y="210" width="860" height="530" rx="12" fill="#0f172a"/>
    <!-- Text area mock -->
    <rect x="140" y="240" width="520" height="320" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="160" y="280" font-family="system-ui, sans-serif" font-size="18" fill="#e2e8f0">Paste your text here...</text>
    <text x="160" y="320" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">ToolNova helps you count words,</text>
    <text x="160" y="348" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">characters, sentences and more</text>
    <text x="160" y="376" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">instantly — all in your browser.</text>
    <!-- Stats panel -->
    <rect x="680" y="240" width="260" height="320" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="810" y="280" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#a78bfa" text-anchor="middle">Live Stats</text>
    <text x="700" y="330" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0">Words</text>
    <text x="900" y="330" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#22d3ee" text-anchor="end">42</text>
    <text x="700" y="370" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0">Characters</text>
    <text x="900" y="370" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#22d3ee" text-anchor="end">248</text>
    <text x="700" y="410" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0">Sentences</text>
    <text x="900" y="410" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#22d3ee" text-anchor="end">3</text>
    <text x="700" y="450" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0">Reading</text>
    <text x="900" y="450" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#22d3ee" text-anchor="end">12s</text>
    <text x="700" y="500" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Top keyword: ToolNova</text>
  </g>
  <!-- Badge -->
  <g filter="url(#shadow)">
    <rect x="320" y="800" width="440" height="80" rx="40" fill="#8b5cf6"/>
    <text x="540" y="850" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">100% Private • No Upload</text>
  </g>
  <!-- ToolNova branding -->
  <text x="540" y="940" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#f8fafc" text-anchor="middle">ToolNova</text>
  <text x="540" y="990" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Word Counter</text>
</svg>