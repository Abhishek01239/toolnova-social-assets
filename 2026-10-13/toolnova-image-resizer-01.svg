<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="140" y="180" width="800" height="620" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <!-- Browser top bar -->
  <rect x="140" y="180" width="800" height="40" rx="16" fill="#0f172a"/>
  <circle cx="165" cy="200" r="6" fill="#ef4444"/>
  <circle cx="185" cy="200" r="6" fill="#f59e0b"/>
  <circle cx="205" cy="200" r="6" fill="#10b981"/>
  <rect x="230" y="190" width="500" height="20" rx="10" fill="#334155"/>
  <text x="240" y="204" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Image Resizer — ToolNova</text>
  <!-- Content area -->
  <rect x="160" y="240" width="760" height="540" fill="#0f172a"/>
  <!-- Left image (original) -->
  <rect x="200" y="300" width="280" height="210" rx="8" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="410" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0" text-anchor="middle">Original</text>
  <text x="340" y="435" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">1920 × 1080</text>
  <!-- Arrow -->
  <path d="M500 400 L540 400" stroke="#06b6d4" stroke-width="3"/>
  <polygon points="535,392 550,400 535,408" fill="#06b6d4"/>
  <!-- Right image (resized) -->
  <rect x="580" y="330" width="180" height="150" rx="8" fill="#06b6d4" opacity="0.3" stroke="#06b6d4" stroke-width="2"/>
  <text x="670" y="400" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle">Resized</text>
  <text x="670" y="420" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">800 × 450</text>
  <!-- Controls -->
  <rect x="200" y="540" width="640" height="80" rx="8" fill="#1e293b"/>
  <text x="220" y="570" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Width: 800px</text>
  <text x="400" y="570" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Height: 450px</text>
  <rect x="200" y="585" width="200" height="8" rx="4" fill="#334155"/>
  <rect x="200" y="585" width="120" height="8" rx="4" fill="url(#accent)"/>
  <!-- Title -->
  <text x="540" y="120" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">Image Resizer</text>
  <text x="540" y="160" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Resize photos by pixels, percent or presets</text>
  <!-- Privacy badge -->
  <rect x="340" y="840" width="400" height="60" rx="30" fill="#10b981"/>
  <text x="540" y="878" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">🔒 Private • Browser-only • No upload</text>
  <!-- ToolNova -->
  <text x="540" y="980" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#3b82f6" text-anchor="middle">ToolNova</text>
</svg>